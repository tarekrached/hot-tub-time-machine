name: Deploy to Val Town

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install vt CLI
        run: deno install --global --force --allow-read --allow-write --allow-env --allow-net jsr:@valtown/vt

      - name: Clone val and push changes
        env:
          VAL_TOWN_API_KEY: ${{ secrets.VAL_TOWN_API_KEY }}
        run: |
          # Clone the existing val to get the .vt metadata
          vt clone ${{ vars.VT_PROJECT }} vt-project

          # Copy source files over the cloned val
          cp -r backend frontend shared index.ts vt-project/

          # Push to Val Town
          cd vt-project
          vt push
